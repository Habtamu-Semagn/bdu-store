# BDU Store — Render deployment blueprint
# Deploys the NestJS backend and a managed PostgreSQL database.
#
# Usage:
#   1. Render CLI:   render deploy --env prod --config render.yaml
#   2. Render UI:    Create Blueprint from this file in the Render Dashboard
#
# Environment variables are referenced from the repository's .env.example.
# Set them in the Render Dashboard under the web service's Environment tab.

databases:
  - name: bdu-store-db
    plan: free          # Free tier; upgrade to Standard+ for production
    postgresVersion: 16
    name: bdu_store
    user: bdu
    # Password is auto-generated by Render; it is available in the dashboard
    # and exported as the DATABASE_URL environment variable automatically.

services:
  - type: web
    name: bdu-store-backend
    region: oregon       # Change to your preferred region
    env: node
    plan: free            # Free tier; upgrade to Standard+ for production
    buildCommand: |
      cd backend
      npm ci
      npm run build
      npx prisma generate
    preDeployCommand: |
      cd backend
      npm run prisma:deploy
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: APP_PORT
        value: "4000"
      - key: JWT_SECRET
        # Generate with: openssl rand -hex 48
        generate: true
      - key: JWT_EXPIRATION
        value: "7d"
      - key: CLIENT_URL
        # Set to your frontend URL after deployment
        value: "https://your-frontend-url.com"
      - key: ADMIN_UNIVERSITY_ID
        # Required for seeding. Set to your admin's university ID.
        value: "bdu0000001"
      - key: ADMIN_PASSWORD
        # Required for seeding. Min 8 characters.
        generate: true
      - key: ADMIN_FULL_NAME
        value: "BDU Store Administrator"
      - key: SEED_DEMO_DATA
        value: "false"
      # DATABASE_URL is automatically injected by Render from the database service.
      # It overrides any local .env value.
    # The following hook runs the seed script after the first successful deploy.
    # It is NOT run on every deploy — only when the service is first created.
    # To re-seed later, run manually via the Render Dashboard's Run Command:
    #   cd backend && npm run prisma:seed
    hooks:
      afterDeploy:
        - |
          cd backend
          npm run prisma:seed